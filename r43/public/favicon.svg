<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sun -->
  <circle cx="50" cy="30" r="18" fill="url(#sunGrad)" />
  <g stroke="#f39c12" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="5" x2="50" y2="-5" />
    <line x1="50" y1="65" x2="50" y2="55" />
    <line x1="25" y1="30" x2="15" y2="30" />
    <line x1="85" y1="30" x2="75" y2="30" />
    <line x1="32" y1="12" x2="25" y2="5" />
    <line x1="75" y1="5" x2="68" y2="12" />
    <line x1="32" y1="48" x2="25" y2="55" />
    <line x1="75" y1="55" x2="68" y2="48" />
  </g>
  
  <!-- Solar Panel -->
  <rect x="15" y="55" width="70" height="35" rx="4" fill="#1e3a5f" stroke="#334155" stroke-width="2" />
  <g stroke="#475569" stroke-width="1">
    <line x1="15" y1="66.5" x2="85" y2="66.5" />
    <line x1="15" y1="78" x2="85" y2="78" />
    <line x1="32.5" y1="55" x2="32.5" y2="90" />
    <line x1="50" y1="55" x2="50" y2="90" />
    <line x1="67.5" y1="55" x2="67.5" y2="90" />
  </g>
  
  <!-- Highlight cells -->
  <rect x="17" y="57" width="13.5" height="7.5" rx="1" fill="url(#panelGrad)" opacity="0.6" />
  <rect x="34.5" y="57" width="13.5" height="7.5" rx="1" fill="url(#panelGrad)" opacity="0.7" />
  <rect x="52" y="57" width="13.5" height="7.5" rx="1" fill="url(#panelGrad)" opacity="0.65" />
  <rect x="69.5" y="57" width="13.5" height="7.5" rx="1" fill="url(#panelGrad)" opacity="0.75" />
</svg>
