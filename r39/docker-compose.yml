services:
  charging-station-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: charging-station-admin
    restart: unless-stopped
    ports:
      - "9090:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
