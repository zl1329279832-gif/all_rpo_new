version: '3.8'

services:
  water-pump-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: water-pump-monitor
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - water-pump-network

networks:
  water-pump-network:
    driver: bridge
