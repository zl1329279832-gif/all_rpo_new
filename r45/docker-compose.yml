services:
  studio-order-system:
    build:
      context: .
      dockerfile: Dockerfile
    image: studio-order-system:latest
    container_name: studio-order-system
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
      - QT_X11_NO_MITSHM=1
      - LANG=zh_CN.UTF-8
      - XAUTHORITY=/root/.Xauthority
    volumes:
      - ./studio.db:/app/studio.db
      - ./thumbnails:/app/thumbnails
      - ./exports:/app/exports
      - ./backups:/app/backups
      - ./logs:/app/logs
    stdin_open: true
    tty: true
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["python", "main.py"]

  headless-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: studio-order-system:latest
    container_name: studio-order-headless
    profiles:
      - headless
    environment:
      - QT_QPA_PLATFORM=offscreen
      - LANG=zh_CN.UTF-8
    volumes:
      - ./studio.db:/app/studio.db
      - ./thumbnails:/app/thumbnails
      - ./exports:/app/exports
      - ./backups:/app/backups
      - ./logs:/app/logs
    command: ["python", "-c", "import sys; sys.path.insert(0,'/app'); from database.db_manager import DatabaseManager; from services.order_service import OrderService; db=DatabaseManager(); svc=OrderService(db); orders=svc.get_all_orders(); print('订单数:', len(orders)); [print(f'  {o[\"order_no\"]}: {o[\"customer_name\"]} - {o[\"order_status\"]}') for o in orders[:5]]; db.close()"]
